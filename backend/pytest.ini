; pytest.ini ham bor — `pyproject.toml` [tool.pytest.ini_options] section
; afzal, lekin ba'zi CI / IDE plug-inlari pytest.ini'ni qidiradi.
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --strict-config --reuse-db -ra
markers =
    slow: tests that take >1s
    integration: integration tests (DB + Redis)
