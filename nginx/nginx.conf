# =============================================================================
# Nginx reverse proxy — My Online Market
#   /            → frontend (Next.js :3000)
#   /api/        → backend  (Django  :8000)
#   /admin/      → backend
#   /static/     → collected static (served by nginx)
#   /media/      → uploaded media
# =============================================================================

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Django static + media (served directly by nginx) ---
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # --- Backend API + admin + schema ---
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend (Next.js) — everything else ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
